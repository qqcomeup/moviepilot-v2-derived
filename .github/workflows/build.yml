name: Build MoviePilot Derived Image

on:
  workflow_dispatch:
    inputs:
      mp_tag:
        description: "Upstream Docker Hub tag, for example 2.14.1. Empty uses latest GitHub release."
        required: false
        type: string
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  packages: write

env:
  UPSTREAM_IMAGE: jxxghp/moviepilot-v2
  IMAGE_NAME: moviepilot-v2-derived

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve upstream tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          input_tag="${{ github.event.inputs.mp_tag || '' }}"
          if [ -n "$input_tag" ]; then
            mp_tag="${input_tag#v}"
          else
            release_json="$(curl -fsSL https://api.github.com/repos/jxxghp/MoviePilot/releases/latest)"
            release_tag="$(printf '%s' "$release_json" | jq -r '.tag_name')"
            mp_tag="${release_tag#v}"
          fi

          if ! printf '%s' "$mp_tag" | grep -Eq '^[0-9]+([.][0-9]+){1,3}([-_A-Za-z0-9.]*)?$'; then
            echo "Invalid upstream tag: $mp_tag" >&2
            exit 1
          fi

          echo "mp_tag=$mp_tag" >> "$GITHUB_OUTPUT"
          echo "target_image=ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "Resolved upstream Docker tag: $mp_tag"

      - name: Wait for upstream Docker Hub tag
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.version.outputs.mp_tag }}"
          url="https://hub.docker.com/v2/repositories/${UPSTREAM_IMAGE}/tags/${tag}"

          for i in $(seq 1 60); do
            if curl -fsSL "$url" >/dev/null; then
              echo "Docker Hub tag is available: ${UPSTREAM_IMAGE}:${tag}"
              exit 0
            fi
            echo "Waiting for Docker Hub tag ${UPSTREAM_IMAGE}:${tag} ($i/60)"
            sleep 30
          done

          echo "Docker Hub tag did not become available: ${UPSTREAM_IMAGE}:${tag}" >&2
          exit 1

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if derived tag already exists
        id: existing
        shell: bash
        run: |
          set -euo pipefail

          image="${{ steps.version.outputs.target_image }}"
          tag="${{ steps.version.outputs.mp_tag }}"

          if docker manifest inspect "${image}:${tag}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Derived image already exists: ${image}:${tag}"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Derived image does not exist yet: ${image}:${tag}"
          fi

      - name: Checkout
        if: steps.existing.outputs.exists != 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.existing.outputs.exists != 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.existing.outputs.exists != 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64
          build-args: |
            MP_TAG=${{ steps.version.outputs.mp_tag }}
          tags: |
            ${{ steps.version.outputs.target_image }}:${{ steps.version.outputs.mp_tag }}
            ${{ steps.version.outputs.target_image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.base.name=${{ env.UPSTREAM_IMAGE }}:${{ steps.version.outputs.mp_tag }}
